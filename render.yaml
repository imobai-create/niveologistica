services:
  - type: web
    name: chamacarga-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        sync: false           # cole a URL do Supabase no dashboard (sslmode=require)
      - key: SUPABASE_JWT_SECRET
        sync: false           # Supabase → Settings → API → JWT Secret; obrigatório
      - key: ANTHROPIC_API_KEY
        sync: false           # chave da Anthropic, opcional para o /agente
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CORS_ORIGINS
        sync: false           # ex.: https://chamacarga.vercel.app  (não use *)
      - key: SERVICE_TOKEN
        sync: false           # opcional: token de bypass para simulador/cron
