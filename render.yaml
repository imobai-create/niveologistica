services:
  - type: web
    name: chamacarga-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        sync: false           # cole a URL do Supabase no dashboard (sslmode=require)
      - key: SUPABASE_JWT_SECRET
        sync: false           # Supabase → Settings → API → JWT Secret; obrigatório
      - key: ANTHROPIC_API_KEY
        sync: false           # chave da Anthropic, opcional para o /agente
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: CORS_ORIGINS
        sync: false           # ex.: https://chamacarga.vercel.app  (não use *)
      - key: SERVICE_TOKEN
        sync: false           # opcional: token de bypass para simulador/cron
      - key: SUPABASE_URL
        sync: false           # ex.: https://<projeto>.supabase.co (usado pelo upload de POD)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false           # Supabase → Settings → API → service_role (upload no Storage)
      - key: STORAGE_BUCKET
        value: pods
      - key: UPLOAD_MAX_MB
        value: "8"

  # ---- Cron 1: sensor mudo (a cada 5 min) ----
  - type: cron
    name: chamacarga-cron-sensor-mudo
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "*/5 * * * *"
    startCommand: python jobs.py detectar-sensor-mudo
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        sync: false
      - key: SENSOR_MUDO_LIMITE_MIN
        value: "10"

  # ---- Cron 2: expiração de tokens públicos (uma vez ao dia, 03:00 UTC) ----
  - type: cron
    name: chamacarga-cron-expirar-tokens
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "0 3 * * *"
    startCommand: python jobs.py expirar-tokens
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DATABASE_URL
        sync: false
      - key: TOKENS_RETENCAO_DIAS
        value: "7"
